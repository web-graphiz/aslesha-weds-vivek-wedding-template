<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFDF73"/>
            <stop offset="50%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#AA7C11"/>
        </linearGradient>
    </defs>
    <!-- Background Circle -->
    <circle cx="32" cy="32" r="30" fill="#7A1C1C" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2,2"/>
    <!-- Traditional Kolam / Monogram Motif -->
    <text x="32" y="38" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">A&amp;V</text>
    <circle cx="32" cy="14" r="2" fill="url(#goldGrad)"/>
    <circle cx="32" cy="50" r="2" fill="url(#goldGrad)"/>
</svg>

